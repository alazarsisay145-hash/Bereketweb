<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bereket Juice and Salad logo">
  <defs>
    <linearGradient id="fruitG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb648"/>
      <stop offset="0.55" stop-color="#f58023"/>
      <stop offset="1" stop-color="#d95a12"/>
    </linearGradient>
    <linearGradient id="juiceG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd987"/>
      <stop offset="1" stop-color="#f09b3a"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd14f"/>
      <stop offset="1" stop-color="#3f9e3f"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#e2a713"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="#0c0c0c"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="#f5f2ea" stroke-width="3" opacity="0.8"/>

  <!-- fruit cup mark -->
  <g transform="translate(256 150) scale(0.92)">
    <path d="M18 -34 C 24 -52 40 -62 58 -60" fill="none" stroke="#f5f2ea" stroke-width="10" stroke-linecap="round"/>
    <path d="M54 -66 L 66 -102 L 80 -98 L 68 -62 Z" fill="#f5f2ea"/>
    <path d="M-6 -58 C -20 -92 -48 -104 -64 -102 C -62 -74 -38 -56 -6 -58 Z" fill="#6abf45"/>
    <path d="M0 -54 C -32 -72 -62 -64 -72 -54 C -54 -34 -22 -36 0 -54 Z" fill="url(#leafG)"/>
    <path d="M44 -4 A 54 54 0 1 1 -12 -52 C -38 -40 -50 -18 -45 8 A 54 54 0 0 0 44 -4 Z"
          fill="url(#fruitG)" transform="rotate(-12)"/>
    <path d="M35 0 A 42 42 0 1 1 -8 -38 C -26 -28 -34 -12 -31 6 A 42 42 0 0 0 35 0 Z"
          fill="url(#juiceG)" transform="rotate(-12)"/>
    <circle cx="-44" cy="30" r="7" fill="#ffce8f" opacity="0.9"/>
    <circle cx="-32" cy="50" r="4.6" fill="#ffce8f" opacity="0.75"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="316" text-anchor="middle"
        font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="88" font-weight="800"
        letter-spacing="-2"><tspan fill="#f5f2ea">Bere</tspan><tspan fill="url(#goldG)" font-style="italic">Ket</tspan></text>

  <!-- leaf sprig -->
  <g transform="translate(404 218) rotate(20)">
    <path d="M0 0 C -15 -11 -13 -32 0 -41 C 13 -32 15 -11 0 0 Z" fill="#f5f2ea"/>
    <path d="M13 6 C 2 -7 7 -26 20 -32 C 29 -21 27 -2 13 6 Z" fill="#f5f2ea" opacity="0.9"/>
  </g>

  <text x="256" y="368" text-anchor="middle"
        font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="27" font-weight="600"
        fill="#f5f2ea" letter-spacing="7">JUICE &amp; SALAD</text>
</svg>
